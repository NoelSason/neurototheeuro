[project]
name = "n2e"
version = "0.1.0"
description = "neurototheeuro — Step-1 brain-foundation-model de-risking (Model A vs B) on ds005273 EEG"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "mne>=1.6",
  "mne-bids>=0.14",
  "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
# Real-data fetch from OpenNeuro. git-annex (system pkg) is the actual transport;
# datalad is an optional convenience wrapper.
fetch = ["datalad>=1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
